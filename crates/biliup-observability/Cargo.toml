[package]
name = "biliup-observability"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone, bounded structured event capture and SQLite storage"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-core = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1.18", features = ["v4"] }
libc = "0.2.174"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
tracing-appender = { workspace = true }
time = { workspace = true, features = ["macros", "local-offset"] }
